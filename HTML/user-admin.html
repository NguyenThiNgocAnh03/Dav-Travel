<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Người Dùng - DAV Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/user-admin.css">
</head>
<body>
  <header class="admin-header">
    <h1>Quản lý Người Dùng - DAV Travel</h1>
    <div class="header-buttons">
      <a href="admin.html"><i class="bi bi-arrow-left"></i> Quay lại Admin</a>
      <a href="tour-admin.html"><i class="bi bi-map"></i> Quản lý Tour</a>
    </div>
  </header>

  <main class="admin-container">
    <!-- Form thêm/sửa user -->
    <section class="form-section">
      <h2>Thêm / Cập nhật Người Dùng</h2>
      <form id="userForm">
        <input type="hidden" id="userId" />

        <label for="name">Họ tên:</label>
        <input type="text" id="name" placeholder="Nhập họ tên" required />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Nhập email" required />

        <!-- THÊM TRƯỜNG PASSWORD -->
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" />
        <small style="color: #666; font-size: 12px; display: block; margin-top: -10px; margin-bottom: 15px;">
          * Để trống nếu không muốn thay đổi mật khẩu (khi sửa user)
        </small>

        <label for="role">Vai trò:</label>
        <select id="role">
          <option value="User">User</option>
          <option value="Admin">Admin</option>
        </select>

        <button type="submit" id="saveBtn">Lưu User</button>
      </form>
    </section>

    <!-- Danh sách user -->
    <section class="table-section">
      <h2>Danh sách Người Dùng</h2>
      <table id="userTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="../javascript/user-admin.js"></script>
</body>
</html>
