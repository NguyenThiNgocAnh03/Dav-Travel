<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAV Travel - Tour Du Lịch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/tours.css">
</head>

<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo-box">
      <img src="../image/logo.jpg" alt="DAV Travel Logo">
      <h1>DAV Travel</h1>
    </div>

    <nav>
      <ul>
        <li><a href="homepage.html">Trang chủ</a></li>
        <li><a href="tours.html" class="active">Tour</a></li>
        <li><a href="history.html">Lịch sử</a></li>
        <li><a href="contact.html">Liên hệ</a></li>
      </ul>
    </nav>

    <div class="auth-buttons" id="authArea">
      <!-- Chưa đăng nhập -->
      <button class="btn-auth" id="loginBtn"><a href="user.html?mode=login">Đăng nhập</a></button>
      <button class="btn-auth" id="registerBtn"><a href="user.html?mode=register">Đăng ký</a></button>

      <!-- Đã đăng nhập -->
      <div class="user-menu" id="userMenu" style="display: none;">
        <i class="bi bi-person-circle user-icon" id="user-icon"></i>
        <div class="user-info">
          <span id="username"></span>
          <button id="logoutBtn">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== THANH TÌM KIẾM & LỌC ===== -->
  <section class="filter-bar">
    <input type="text" id="search-input" placeholder="🔍 Tìm kiếm tour...">
    <select id="filter-select">
      <option value="all">Tất cả</option>
      <option value="highlight">Nổi bật</option>
      <option value="north">Miền Bắc</option>
      <option value="central">Miền Trung</option>
      <option value="south">Miền Nam</option>
    </select>
  </section>

  <!-- ===== DANH SÁCH TOUR ===== -->
  <main>
    <div id="all-tours" class="tour-container"></div>
  </main>

  <!-- ===== MODAL CHI TIẾT TOUR ===== -->
<div id="tour-modal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>

    <div id="modal-banner"></div>
    <div id="modal-info"></div>

    <div class="modal-footer">
      <button id="bookNowBtn" class="book-btn">Đặt tour</button>
    </div>
  </div>
</div>


  <!-- ===== FORM ĐẶT TOUR ===== -->
  <div id="overlay" class="overlay"></div>
  <div id="bookingFormPopup" class="booking-form-popup">
    <form id="bookingForm" class="booking-form">
      <h3>Đặt Tour Du Lịch</h3>

      <label>Họ và tên</label>
      <input type="text" id="fullName" placeholder="Nhập họ và tên" required>

      <label>Email</label>
      <input type="email" id="email" placeholder="Nhập email" required>

      <label>Số điện thoại</label>
      <input type="text" id="phone" placeholder="Nhập số điện thoại" required>

      <label>Số người</label>
      <input type="number" id="quantity" min="1" value="1" required>

      <label>Ngày đi</label>
      <input type="date" id="travelDate" required>

      <label>Ghi chú thêm</label>
      <textarea id="note" rows="3" placeholder="Yêu cầu đặc biệt (nếu có)"></textarea>

      <button type="submit">Xác nhận đặt tour</button>
      <button type="button" id="closeForm" class="cancel-btn">Hủy</button>
    </form>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-container">
      <div class="footer-column">
        <h3>Liên hệ</h3>
        <p>Địa chỉ: 06 Tôn Thất Tùng, Đà Nẵng, Việt Nam</p>
        <p>Điện thoại: 0123 456 789</p>
        <p>Email: info@davtravel.vn</p>
        <div class="social-icons">
          <a href="#"><img src="https://store-images.s-microsoft.com/image/apps.37935.9007199266245907.b029bd80-381a-4869-854f-bac6f359c5c9.91f8693c-c75b-4050-a796-63e1314d18c9?h=210" alt="Facebook"></a>
          <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Instagram_logo_2022.svg/250px-Instagram_logo_2022.svg.png" alt="Instagram"></a>
          <a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-7o9w5nKE-Scl6VfHWM3lp5dieoPClpxQBQ&s" alt="Zalo"></a>
        </div>
        <button class="call-btn">1900 1000</button>
      </div>

      <div class="footer-column">
        <h3>Chứng nhận</h3>
        <img src="https://webmedia.com.vn/images/2021/09/logo-da-thong-bao-bo-cong-thuong-mau-xanh.png" class="cert-img">
        <img src="https://thumbs.dreamstime.com/b/dmca-digital-millennium-copyright-act-stock-vector-dmca-digital-millennium-copyright-act-vector-133426053.jpg" class="cert-img">
      </div>

      <div class="footer-column">
        <h3>Chấp nhận thanh toán</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRB6YnQoM78NCEw3f--iWcGhpQFjBxfo9k6fw&s" class="pay-img">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" class="pay-img">
        <img src="https://upload.wikimedia.org/wikipedia/vi/f/fe/MoMo_Logo.png" class="pay-img">
        <img src="https://yt3.googleusercontent.com/JM1m2wng0JQUgSg9ZSEvz7G4Rwo7pYb4QBYip4PAhvGRyf1D_YTbL2DdDjOy0qOXssJPdz2r7Q=s900-c-k-c0x00ffffff-no-rj" class="pay-img">
      </div>
    </div>

    <div class="footer-bottom">
      <p>© 2025 DAV Travel. All rights reserved.</p>
    </div>
  </footer>

  <script src="../javascript/tours.js"></script>
  <script src="../javascript/auth.js"></script>
</body>
</html>
